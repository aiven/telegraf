name: Aiven lint

on:
  pull_request:
    branches: ['v*-aiven']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint Markdown files changed by the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=d "$BASE_SHA...HEAD" -- '*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Markdown files changed."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          npx --yes markdownlint-cli@0.49.1 --config .markdownlint.jsonc "${files[@]}"
